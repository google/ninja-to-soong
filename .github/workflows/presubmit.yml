name: Presubmit
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  format:
    name: Code formatting check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check format
        shell: bash
        run: |
          set -x
          find -name *.rs -exec rustfmt {} \+
          git diff --exit-code
  build:
    name: Test ${{ matrix.project }}
    needs: format
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [OpenCL, fwupd, media-driver, mesa, angle, unittests, external-project]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Ninja
        shell: bash
        run: |
          set -x
          sudo apt install ninja-build
      - name: Setup environement variables
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: |
          set -x
          key_folders=".github/workflows/*.yml"
          android_ndk="android-ndk-r30"
          if [ "${PROJECT}" == "OpenCL" ]; then
            projects="clvk clspv llvm-project SPIRV-Tools SPIRV-Headers OpenCL-CTS OpenCL-ICD-Loader OpenCL-Headers clpeak libclc"
          elif [ "${PROJECT}" == "fwupd" ]; then
            key_folders="${key_folders} tests/fwupd/build.ninja"
            projects="fwupd"
            android_ndk="android-ndk-r27c"
          elif [ "${PROJECT}" == "media-driver" ]; then
            projects="media-driver"
          elif [ "${PROJECT}" == "mesa" ]; then
            projects="desktop/mesa3d/intel desktop/mesa3d/panvk vkoverhead"
          elif [ "${PROJECT}" == "angle" ]; then
            key_folders="${key_folders} tests/angle/build-*"
            projects="angle"
          elif [ "${PROJECT}" == "external-project" ]; then
            echo "extra_args=--ext-proj-path ${GITHUB_WORKSPACE}/tests/external-project/project.rs" >> $GITHUB_ENV
          elif [ "${PROJECT}" == "unittests" ]; then
            projects="unittests"
          fi
          android="$(realpath ${GITHUB_WORKSPACE}/../android)"
          mkdir -p "${android}"
          for project in ${projects}
          do
            key_folders="${key_folders} scripts/${project}/* tests/${project}/checkout.sh"
          done
          echo "key=$(git log -1 --format='%h' ${key_folders})-${PROJECT}" >> $GITHUB_ENV
          echo "projects=${projects}" >> $GITHUB_ENV
          echo "android=${android}" >> $GITHUB_ENV
          echo "android_ndk=${android_ndk}" >> $GITHUB_ENV
          echo "tmp_dir=$(realpath ${GITHUB_WORKSPACE}/../tmp)" >> $GITHUB_ENV
      - name: Get repositories from cache
        id: checkout-repositories
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.tmp_dir }}
          key: ${{ env.key }}
      - name: Tests w/o cache
        if: steps.checkout-repositories.outputs.cache-hit != 'true'
        shell: bash
        env:
          N2S_TMP_PATH: ${{ env.tmp_dir }}
          N2S_NDK_PATH: ${{ env.android }}
          N2S_NDK: ${{ env.android_ndk }}
        run: |
          set -x
          for checkout in ${projects}
          do
            bash "tests/${checkout}/checkout.sh" "${android}"
          done
          cargo run --features debug_project --release -- --clean-tmp --skip-build --aosp-path "${android}" ${projects} ${extra_args}
      - name: Tests w/ cache
        if: steps.checkout-repositories.outputs.cache-hit == 'true'
        shell: bash
        env:
          N2S_TMP_PATH: ${{ env.tmp_dir }}
          N2S_NDK_PATH: ${{ env.android }}
          N2S_NDK: ${{ env.android_ndk }}
        run: |
          set -x
          cargo run --features debug_project --release -- --skip-gen-ninja --aosp-path "${android}" ${projects} ${extra_args}
      - name: Check generated files
        shell: bash
        run: |
          set -x
          git diff --exit-code
